[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-ml-systems-lab"
version = "0.1.0"
description = "Reproducible reference implementations of ML systems algorithms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mlsystems = "mlsystems.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
